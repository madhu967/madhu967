name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v3
      
      - uses: Platane/snk/svg-only@v3
        id: snake-gif
        with:
          github_user_name: madhu967
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#10B981&color_dots=#F8FAFC,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?color_snake=#10B981&color_dots=#2d3343,#0e4429,#006d32,#26a641,#39d353&palette=github-dark
            
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
