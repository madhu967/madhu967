<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300">
  <defs>
    <style>
  * { font-family: 'Courier New', monospace; }
  .display { font-family: 'Arial', sans-serif; font-weight: 800; }
</style>
<pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
   <circle cx="2" cy="2" r="1.5" fill="#247bff" opacity="0.1" />
</pattern>
<linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
   <stop offset="0%" stop-color="#247bff" />
   <stop offset="100%" stop-color="#ff354f" />
</linearGradient>
    <style>
      .slide { opacity: 0; animation: carousel 12s infinite both; }
      .s1 { animation-delay: 0s; } .s2 { animation-delay: 4s; } .s3 { animation-delay: 8s; }
      @keyframes carousel { 0%, 30% { opacity: 1; transform: translateX(0); } 33%, 97% { opacity: 0; transform: translateX(-20px); } 100% { opacity: 0; transform: translateX(20px); } }
      .bar { fill: #247bff; animation: progress 12s infinite linear; }
      .b1 { animation-delay: 0s; } .b2 { animation-delay: 4s; } .b3 { animation-delay: 8s; }
      @keyframes progress { 0% { width: 0; } 33%, 100% { width: 80px; } }
    </style>
  </defs>
  <rect width="798" height="298" x="1" y="1" rx="16" fill="#070b16" stroke="url(#border-grad)" stroke-width="2"/>
  <rect width="800" height="300" rx="16" fill="url(#dots)" />
  <g transform="translate(50, 50)">
     <text fill="#247bff" font-size="32" class="display">Capabilities</text>
     <g transform="translate(0, 40)" fill="#f8f9fa" font-size="16">
        <rect x="0" y="0" width="120" height="30" rx="15" fill="#247bff" opacity="0.2"/><text x="60" y="20" text-anchor="middle">React.js</text>
        <rect x="130" y="0" width="120" height="30" rx="15" fill="#247bff" opacity="0.2"/><text x="190" y="20" text-anchor="middle">Node.js</text>
        <rect x="260" y="0" width="120" height="30" rx="15" fill="#247bff" opacity="0.2"/><text x="320" y="20" text-anchor="middle">MongoDB</text>
        <rect x="0" y="45" width="120" height="30" rx="15" fill="#247bff" opacity="0.2"/><text x="60" y="65" text-anchor="middle">Tailwind</text>
        <rect x="130" y="45" width="120" height="30" rx="15" fill="#247bff" opacity="0.2"/><text x="190" y="65" text-anchor="middle">Express.js</text>
        <rect x="260" y="45" width="120" height="30" rx="15" fill="#247bff" opacity="0.2"/><text x="320" y="65" text-anchor="middle">Java / DSA</text>
     </g>
  </g>
  <g transform="translate(450, 50)">
     <text fill="#ff354f" font-size="32" class="display">Interests</text>
     <g transform="translate(0, 30)">
        <rect x="0" y="0" width="80" height="4" fill="#8b9bb4" rx="2" /><rect x="0" y="0" height="4" class="bar b1" rx="2" />
        <rect x="90" y="0" width="80" height="4" fill="#8b9bb4" rx="2" /><rect x="90" y="0" height="4" class="bar b2" rx="2" />
        <rect x="180" y="0" width="80" height="4" fill="#8b9bb4" rx="2" /><rect x="180" y="0" height="4" class="bar b3" rx="2" />
     </g>
     <g transform="translate(0, 70)">
        <g class="slide s1"><text fill="#f8f9fa" font-size="24" class="display">Full Stack Architectures</text><text y="30" fill="#8b9bb4" font-size="14">Building scalable MERN applications</text><text y="50" fill="#8b9bb4" font-size="14">with secure JWT authentication.</text></g>
        <g class="slide s2"><text fill="#f8f9fa" font-size="24" class="display">AI Integration</text><text y="30" fill="#8b9bb4" font-size="14">Leveraging Gemini AI for dynamic</text><text y="50" fill="#8b9bb4" font-size="14">analysis and automation workflows.</text></g>
        <g class="slide s3"><text fill="#f8f9fa" font-size="24" class="display">UI/UX &amp; Animations</text><text y="30" fill="#8b9bb4" font-size="14">Crafting responsive, accessible,</text><text y="50" fill="#8b9bb4" font-size="14">and animated frontend experiences.</text></g>
     </g>
  </g>
</svg>
