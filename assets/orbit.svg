<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&amp;family=Outfit:wght@800&amp;display=swap');
      .bg { fill: #0d1117; }
      .orbit { fill: none; stroke: #30363d; stroke-width: 2; stroke-dasharray: 4 4; }
      .center-glow { fill: #58a6ff; filter: blur(20px); opacity: 0.3; }
      .text { font-family: 'Fira Code', system-ui, monospace; font-weight: 700; font-size: 14px; fill: #c9d1d9; }
      .title { font-family: 'Outfit', system-ui, sans-serif; font-weight: 800; font-size: 24px; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>
  
  <rect width="800" height="300" rx="12" class="bg" />
  
  <!-- Orbits -->
  <circle cx="400" cy="150" r="50" class="center-glow" />
  <text x="400" y="158" class="title">MERN</text>
  
  <ellipse cx="400" cy="150" rx="150" ry="60" class="orbit" />
  <ellipse cx="400" cy="150" rx="250" ry="100" class="orbit" />
  <ellipse cx="400" cy="150" rx="350" ry="140" class="orbit" />
  
  <path id="path1" d="M 550 150 A 150 60 0 1 1 549.9 150" fill="none" />
  <path id="path2" d="M 650 150 A 250 100 0 1 1 649.9 150" fill="none" />
  <path id="path3" d="M 750 150 A 350 140 0 1 1 749.9 150" fill="none" />
  
  <g><circle r="25" fill="#238636"/><text y="5" text-anchor="middle" class="text" fill="#fff">Mongo</text><animateMotion dur="12s" repeatCount="indefinite"><mpath href="#path1"/></animateMotion></g>
  <g><circle r="25" fill="#000000" stroke="#30363d" stroke-width="2"/><text y="5" text-anchor="middle" class="text">Exp</text><animateMotion dur="18s" repeatCount="indefinite" begin="-4s"><mpath href="#path2"/></animateMotion></g>
  <g><circle r="25" fill="#1f6feb"/><text y="5" text-anchor="middle" class="text" fill="#fff">React</text><animateMotion dur="24s" repeatCount="indefinite" begin="-8s"><mpath href="#path3"/></animateMotion></g>
  <g><circle r="25" fill="#238636"/><text y="5" text-anchor="middle" class="text" fill="#fff">Node</text><animateMotion dur="12s" repeatCount="indefinite" begin="-6s"><mpath href="#path1"/></animateMotion></g>
  
</svg>
