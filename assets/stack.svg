<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="400">
  <defs>
    <style>
  * { font-family: 'Courier New', monospace; }
  .display { font-family: 'Arial', sans-serif; font-weight: 800; }
</style>
<pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
   <circle cx="2" cy="2" r="1.5" fill="#247bff" opacity="0.1" />
</pattern>
<linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
   <stop offset="0%" stop-color="#247bff" />
   <stop offset="100%" stop-color="#ff354f" />
</linearGradient>
  </defs>
  <rect width="798" height="398" x="1" y="1" rx="16" fill="#070b16" stroke="url(#border-grad)" stroke-width="2"/>
  <rect width="800" height="400" rx="16" fill="url(#dots)" />
  <circle cx="400" cy="200" r="40" fill="#247bff" opacity="0.2" />
  <text x="400" y="208" fill="#247bff" font-size="24" class="display" text-anchor="middle">TECH</text>
  <g stroke="#247bff" fill="none" stroke-width="1" stroke-dasharray="4 4" opacity="0.3">
    <ellipse cx="400" cy="200" rx="120" ry="60" />
    <ellipse cx="400" cy="200" rx="200" ry="100" />
    <ellipse cx="400" cy="200" rx="280" ry="140" />
  </g>
  <path id="o1" d="M 520 200 A 120 60 0 1 1 519.9 200" fill="none" />
  <path id="o2" d="M 600 200 A 200 100 0 1 1 599.9 200" fill="none" />
  <path id="o3" d="M 680 200 A 280 140 0 1 1 679.9 200" fill="none" />
  <g><circle r="15" fill="#f8f9fa"/><text y="4" font-size="10" text-anchor="middle" fill="#070b16" font-weight="bold">JS</text><animateMotion dur="10s" repeatCount="indefinite"><mpath href="#o1"/></animateMotion></g>
  <g><circle r="20" fill="#ff354f"/><text y="5" font-size="12" text-anchor="middle" fill="#f8f9fa" font-weight="bold">React</text><animateMotion dur="15s" repeatCount="indefinite"><mpath href="#o2"/></animateMotion></g>
  <g><circle r="18" fill="#247bff"/><text y="4" font-size="10" text-anchor="middle" fill="#f8f9fa" font-weight="bold">Node</text><animateMotion dur="20s" repeatCount="indefinite"><mpath href="#o3"/></animateMotion></g>
  <g><circle r="15" fill="#4DB33D"/><text y="4" font-size="10" text-anchor="middle" fill="#f8f9fa" font-weight="bold">Mongo</text><animateMotion dur="25s" repeatCount="indefinite" keyPoints="0.5;1;0;0.5" keyTimes="0;0.5;0.5;1" calcMode="linear"><mpath href="#o2"/></animateMotion></g>
