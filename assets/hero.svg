<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;display=swap');
      .bg { fill: #0d1117; }
      .window-bar { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .text { font-family: 'Fira Code', monospace; font-size: 16px; }
      .keyword { fill: #ff7b72; font-weight: 600; }
      .variable { fill: #79c0ff; font-weight: 600; }
      .operator { fill: #c9d1d9; }
      .string { fill: #a5d6ff; }
      .property { fill: #d2a8ff; }
      .punctuation { fill: #c9d1d9; }
      .comment { fill: #8b949e; font-style: italic; }
      .cursor { fill: #c9d1d9; animation: blink 1s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      
      .line { opacity: 0; animation: fadeIn 0.1s forwards; }
      .l1 { animation-delay: 0.5s; }
      .l2 { animation-delay: 1.5s; }
      .l3 { animation-delay: 2.5s; }
      .l4 { animation-delay: 3.5s; }
      .l5 { animation-delay: 4.5s; }
      .l6 { animation-delay: 5.5s; }
      @keyframes fadeIn { to { opacity: 1; } }
    </style>
  </defs>
  
  <!-- Window Background -->
  <rect width="798" height="248" x="1" y="1" rx="10" class="bg" stroke="#30363d" stroke-width="2"/>
  
  <!-- Top Bar -->
  <path d="M 1 11 Q 1 1 11 1 L 789 1 Q 799 1 799 11 L 799 35 L 1 35 Z" class="window-bar" />
  <circle cx="25" cy="18" r="6" fill="#ff5f56" />
  <circle cx="45" cy="18" r="6" fill="#ffbd2e" />
  <circle cx="65" cy="18" r="6" fill="#27c93f" />
  <text x="400" y="23" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">madhu@workspace: ~</text>

  <!-- Floating accent -->
  <circle cx="700" cy="150" r="120" fill="#58a6ff" opacity="0.05" filter="blur(30px)" />
  <circle cx="650" cy="100" r="80" fill="#bc8cff" opacity="0.05" filter="blur(20px)" />
  
  <g transform="translate(640, 150)" opacity="0.3">
     <text font-family="'Fira Code', monospace" font-size="70" fill="#30363d" font-weight="bold">&lt;/&gt;</text>
  </g>

  <!-- Code Content -->
  <g transform="translate(30, 85)" class="text">
    <g class="line l1">
      <text x="0" y="0"><tspan class="keyword">const</tspan> <tspan class="variable">developer</tspan> <tspan class="operator">=</tspan> <tspan class="punctuation">{</tspan></text>
    </g>
    <g class="line l2">
      <text x="30" y="25"><tspan class="property">name</tspan><tspan class="punctuation">:</tspan> <tspan class="string">'Ijji Madhu Venkat'</tspan><tspan class="punctuation">,</tspan></text>
    </g>
    <g class="line l3">
      <text x="30" y="50"><tspan class="property">role</tspan><tspan class="punctuation">:</tspan> <tspan class="string">'Full Stack Software Engineer'</tspan><tspan class="punctuation">,</tspan></text>
    </g>
    <g class="line l4">
      <text x="30" y="75"><tspan class="property">specialty</tspan><tspan class="punctuation">:</tspan> <tspan class="string">'MERN Stack &amp; AI Integration'</tspan><tspan class="punctuation">,</tspan></text>
    </g>
    <g class="line l5">
      <text x="30" y="100"><tspan class="property">passion</tspan><tspan class="punctuation">:</tspan> <tspan class="string">'Building scalable systems and seamless UIs'</tspan></text>
    </g>
    <g class="line l6">
      <text x="0" y="125"><tspan class="punctuation">}</tspan><tspan class="punctuation">;</tspan> <tspan class="cursor">█</tspan></text>
    </g>
  </g>
</svg>
