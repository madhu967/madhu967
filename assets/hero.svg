<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&amp;family=Outfit:wght@800&amp;display=swap');
      .bg { fill: #0d1117; }
      .title { font-family: 'Outfit', system-ui, sans-serif; font-weight: 800; font-size: 54px; fill: #ffffff; }
      .subtitle { font-family: 'Fira Code', monospace; font-weight: 500; font-size: 20px; fill: #58a6ff; }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      
      .gradient-text { fill: url(#grad); animation: hue 6s infinite linear; }
      @keyframes hue { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
      
      .particle { fill: #58a6ff; opacity: 0.5; animation: float 10s infinite linear; }
      @keyframes float {
         0% { transform: translateY(0px) rotate(0deg); opacity: 0; }
         10% { opacity: 0.5; }
         90% { opacity: 0.5; }
         100% { transform: translateY(-200px) rotate(360deg); opacity: 0; }
      }
    </style>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#ff7b72" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="250" rx="12" class="bg" />
  
  <!-- Particles -->
  <g>
    <circle cx="100" cy="250" r="2" class="particle" style="animation-delay: 0s; animation-duration: 8s" />
    <circle cx="200" cy="250" r="3" class="particle" style="animation-delay: 2s; animation-duration: 12s" />
    <circle cx="350" cy="250" r="1.5" class="particle" style="animation-delay: 4s; animation-duration: 9s" />
    <circle cx="500" cy="250" r="2.5" class="particle" style="animation-delay: 1s; animation-duration: 11s" />
    <circle cx="650" cy="250" r="2" class="particle" style="animation-delay: 5s; animation-duration: 7s" />
    <circle cx="750" cy="250" r="3" class="particle" style="animation-delay: 3s; animation-duration: 10s" />
  </g>

  <text x="50" y="100" class="title">Hi, I'm <tspan class="gradient-text">Ijji Madhu Venkat</tspan></text>
  
  <!-- Typewriter effect for subtitle using clipPath -->
  <clipPath id="typing-clip">
    <rect x="50" y="120" width="0" height="40">
      <animate attributeName="width" values="0;600;600;0" keyTimes="0;0.4;0.9;1" dur="8s" repeatCount="indefinite" />
    </rect>
  </clipPath>
  
  <g clip-path="url(#typing-clip)">
    <text x="50" y="150" class="subtitle">> Full-Stack Developer | MERN Specialist<tspan class="cursor">_</tspan></text>
  </g>
  <text x="50" y="150" class="subtitle" opacity="0.3">> Full-Stack Developer | MERN Specialist</text>
  
  <!-- Animated coding activity bars -->
  <g transform="translate(600, 180)">
    <rect x="0" y="20" width="8" height="10" fill="#ff7b72" rx="4"><animate attributeName="height" values="10;40;10" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="15" y="10" width="8" height="20" fill="#d2a8ff" rx="4"><animate attributeName="height" values="20;50;20" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="30" y="0" width="8" height="30" fill="#79c0ff" rx="4"><animate attributeName="height" values="30;15;30" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="45" y="15" width="8" height="15" fill="#a5d6ff" rx="4"><animate attributeName="height" values="15;35;15" dur="1.4s" repeatCount="indefinite"/></rect>
    <text x="-40" y="45" class="subtitle" font-size="12" fill="#8b949e">Activity</text>
  </g>
</svg>
